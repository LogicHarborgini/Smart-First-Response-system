# .github/workflows/ci-cd.yml
# Pipeline: lint -> test -> Docker build verification.
#
# Deployment is deliberately NOT here. Railway's GitHub integration already
# deploys on every push to main; adding a deploy job would fire two deploys per
# push. CI gates the code, Railway ships it.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Matches python:3.12-slim in the Dockerfile, so CI runs the same interpreter
  # the container does — the local venv is 3.13 and is not the reference.
  PYTHON_VERSION: "3.12"
  # Ruff is pinned for the same reason ruff.toml selects rules explicitly: a new
  # ruff release must not be able to fail this build on its own.
  RUFF_VERSION: "0.16.2"

jobs:

  # -- Job 1: Lint -----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==${{ env.RUFF_VERSION }}

      - name: Run ruff lint
        run: ruff check app/

  # -- Job 2: Test -----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint   # no point testing code that does not lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=80
        env:
          # The fake provider returns canned responses: no network calls, no API
          # cost, no flakiness from a third-party LLM being slow or rate-limited.
          LLM_PROVIDER: fake
          LANGSMITH_TRACING: "false"

  # -- Job 3: Build ----------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test   # only build an image from code that passes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify only, nothing pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sfr-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
